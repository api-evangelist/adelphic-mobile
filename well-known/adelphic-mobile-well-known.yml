notes: >-
  No /.well-known/ discovery document is published anywhere on the Adelphic
  surface. adelphic.com and www.adelphic.com are a legacy JavaScript redirect
  shell that maps retired Adelphic/Specific Media/Vindico domains onto
  viantinc.com product pages (every content path, including /pricing/ and
  /clients/, returns 404). The live API host api.adelphic.com — and its sibling
  api.viantinc.com, which returns the identical `Basic realm="Adelphic"`
  challenge — is gated behind HTTP Basic authentication on every path, so no
  anonymous discovery is possible there. dsp.viantinc.com returns a soft 200
  SPA shell for every path and is explicitly rejected as a false positive.
  NO WellKnown pointer is emitted in apis.yml: this file records a verified
  ABSENCE, and a pointer would assert the provider serves a surface it does not.
