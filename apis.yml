aid: adelphic-mobile
name: Adelphic Mobile *
description: >-
  Adelphic is an enterprise demand-side platform (DSP) for programmatic
  advertising, originally founded as a mobile-first programmatic buying
  platform and acquired by Viant Technology in 2017. The Adelphic DSP lets
  marketers plan, buy, and measure omnichannel campaigns across Connected TV,
  linear TV, mobile, desktop, streaming audio, and digital out-of-home from a
  single self-service interface, using Viant's people-based Household ID
  identity resolution to activate first- and third-party data and measure
  outcomes. It is offered as an enterprise SaaS platform with a hosted UI,
  online knowledge base, and certification/Programmatic University training
  rather than a public developer API; the adelphic.com domain now operates as a
  legacy redirect surface pointing to Viant's product pages. An Adelphic API
  service does exist and is monitored as its own component on the Adelphic
  status page, but api.adelphic.com answers every path with HTTP 401 and
  `WWW-Authenticate: Basic realm="Adelphic"`, and the knowledge base is
  customer-only, so no contract, reference, SDK or pricing is public. Added to
  the API Evangelist network as a portfolio-company profile surfaced from GV.
